name: Package Skills

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: package-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate before packaging
        run: python scripts/validate-skills.py
      - name: Test scripts
        run: python -m unittest discover -s tests -v
      - name: Build and inspect independent ZIPs
        run: python scripts/package-skills.py --sha "$GITHUB_SHA" --output dist
      - name: Upload download packages and SHA manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-${{ github.sha }}
          path: |
            dist/*.zip
            dist/build-*.json
          if-no-files-found: error
          retention-days: 30
