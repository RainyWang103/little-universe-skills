name: Validate Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Skills and Actions YAML
        run: python scripts/validate-skills.py
      - name: Test validation failures and independent packages
        run: python -m unittest discover -s tests -v
      - name: Verify package build
        run: python scripts/package-skills.py --sha "$GITHUB_SHA" --output dist
